<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" role="img" aria-label="Fix the anchor dates first, then count backward to derive every chapter deadline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="bk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="ac"/></marker></defs>
<g class="fig-g">
<line x1="60" y1="110" x2="590" y2="110" class="ln"/>
<text x="52" y="114" text-anchor="end" class="sm">Sept</text><text x="598" y="114" class="sm">June</text>
<g transform="translate(110,110)"><circle r="7" class="bx"/><text y="-20" text-anchor="middle" class="sm">recruit and affiliate</text></g>
<g transform="translate(185,110)"><circle r="7" class="bx"/><text y="32" text-anchor="middle" class="sm">raise the reserve</text></g>
<g transform="translate(260,110)"><circle r="7" class="bx"/><text y="-20" text-anchor="middle" class="sm">practice starts</text></g>
<g transform="translate(335,110)"><circle r="7" class="bx"/><text y="32" text-anchor="middle" class="sm">events chosen</text></g>
<g transform="translate(410,110)"><circle r="8" class="ac-fill"/><text y="-20" text-anchor="middle" class="lb">Round One window</text></g>
<g transform="translate(485,110)"><circle r="8" class="ac-fill"/><text y="32" text-anchor="middle" class="lb">SLC</text></g>
<g transform="translate(560,110)"><circle r="8" class="ac-fill"/><text y="-20" text-anchor="middle" class="lb">DC ILC deadline</text></g>
<path d="M560 178 L112 178" class="ln ac-st" fill="none" marker-end="url(#bk)"/>
<text x="336" y="170" text-anchor="middle" class="sm">count backward from the fixed dates to derive every other one</text>
<text x="320" y="208" text-anchor="middle" class="sm">filled = fixed by the DC HOSA calendar, confirmed every year · open = derived by counting back</text>
<text x="320" y="228" text-anchor="middle" class="lb">no date is chosen; every date is derived</text>
</g></svg>
