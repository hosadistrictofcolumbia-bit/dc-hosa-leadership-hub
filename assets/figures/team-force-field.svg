<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="Force field: driving forces push right toward the change, restraining forces push left; arrow length is strength">
<defs><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ac"/></marker>
<marker id="arL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="mid"/></marker></defs>
<g class="fig-g">
<text x="150" y="22" text-anchor="middle" class="hd">Driving forces</text>
<text x="490" y="22" text-anchor="middle" class="hd">Restraining forces</text>
<rect x="312" y="30" width="16" height="170" rx="4" class="bar"/>
<text x="320" y="222" text-anchor="middle" class="sm">the change</text>
<line x1="60"  y1="56"  x2="300" y2="56"  class="ln ac-st" marker-end="url(#arR)"/><text x="60" y="49" class="tag">strong</text>
<line x1="150" y1="92"  x2="300" y2="92"  class="ln ac-st" marker-end="url(#arR)"/><text x="150" y="85" class="tag">medium</text>
<line x1="200" y1="128" x2="300" y2="128" class="ln ac-st" marker-end="url(#arR)"/><text x="200" y="121" class="tag">weak</text>
<line x1="100" y1="164" x2="300" y2="164" class="ln ac-st" marker-end="url(#arR)"/><text x="100" y="157" class="tag">medium</text>
<line x1="580" y1="56"  x2="340" y2="56"  class="ln mid-st" marker-end="url(#arL)"/><text x="580" y="49" text-anchor="end" class="tag">strong</text>
<line x1="490" y1="92"  x2="340" y2="92"  class="ln mid-st" marker-end="url(#arL)"/><text x="490" y="85" text-anchor="end" class="tag">medium</text>
<line x1="540" y1="128" x2="340" y2="128" class="ln mid-st" marker-end="url(#arL)"/><text x="540" y="121" text-anchor="end" class="tag">strong</text>
<line x1="440" y1="164" x2="340" y2="164" class="ln mid-st" marker-end="url(#arL)"/><text x="440" y="157" text-anchor="end" class="tag">weak</text>
<text x="150" y="196" text-anchor="middle" class="sm">strengthen one</text>
<text x="490" y="196" text-anchor="middle" class="sm">reduce one — usually the easier move</text>
</g></svg>
