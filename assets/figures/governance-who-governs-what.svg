<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 214" role="img" aria-label="Four levels of HOSA governance from HOSA Inc. down to the Local Chapter, with what each decides">
<g class="fig-g">
<text x="20" y="16" class="hd">Level</text><text x="392" y="16" class="hd">Decides</text>
