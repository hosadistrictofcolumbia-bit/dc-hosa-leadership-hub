<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-label="The adoption curve: launch with the early adopters, make their result visible, and the majority follows" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<g class="fig-g">
<path d="M40 170 C120 170, 150 40, 320 40 C490 40, 520 170, 600 170" class="ln mid-st" fill="none"/>
<line x1="40" y1="170" x2="600" y2="170" class="ln"/>
<line x1="150" y1="60" x2="150" y2="170" class="ln dash"/><line x1="240" y1="42" x2="240" y2="170" class="ln dash"/><line x1="400" y1="42" x2="400" y2="170" class="ln dash"/><line x1="490" y1="60" x2="490" y2="170" class="ln dash"/>
<path d="M150 60 C170 44, 200 42, 240 42 L240 170 L150 170 Z" class="ac-lt"/>
<text x="95" y="188" text-anchor="middle" class="sm">innovators</text>
<text x="195" y="188" text-anchor="middle" class="lb">early adopters</text>
<text x="320" y="188" text-anchor="middle" class="sm">early majority</text>
<text x="445" y="188" text-anchor="middle" class="sm">late majority</text>
<text x="545" y="188" text-anchor="middle" class="sm">laggards</text>
<text x="195" y="30" text-anchor="middle" class="lb">launch here — two or three chapters</text>
<line x1="195" y1="36" x2="195" y2="58" class="ln ac-st"/>
<text x="562" y="48" text-anchor="middle" class="sm">the rest move once</text><text x="562" y="63" text-anchor="middle" class="sm">someone else has</text><text x="562" y="78" text-anchor="middle" class="sm">visibly done it</text>
</g></svg>
