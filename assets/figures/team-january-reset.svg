<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="Teams do not improve gradually; they shift sharply at the midpoint of the term, which for a September to May term is January">
<g class="fig-g">
<line x1="40" y1="160" x2="600" y2="160" class="ln"/>
<text x="40" y="180" class="sm">September</text><text x="600" y="180" text-anchor="end" class="sm">May</text><text x="320" y="180" text-anchor="middle" class="lb">January</text>
<line x1="320" y1="44" x2="320" y2="160" class="ln ac-st dash"/>
<path d="M40 140 C150 138, 250 136, 316 134 L324 76 C400 70, 520 62, 600 58" class="ln mid-st" fill="none"/>
<circle cx="320" cy="105" r="6" class="ac-fill"/>
<text x="170" y="122" text-anchor="middle" class="sm">first half — under September's assumptions</text>
<text x="470" y="90" text-anchor="middle" class="sm">second half — after the reset</text>
<text x="320" y="30" text-anchor="middle" class="lb">the midpoint — the team is most willing to change how it works</text>
<text x="320" y="204" text-anchor="middle" class="sm">re-score the five conditions · re-read the charter · midpoint memo</text>
<text x="320" y="218" text-anchor="middle" class="sm">re-derive the calendar · decide the avoided thing</text>
</g></svg>
