<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" role="img" aria-label="A balance: demands on the left outweigh resources on the right; adding one resource changes the ratio" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="dr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ac"/></marker></defs>
<g class="fig-g">
<polygon points="320,150 296,186 344,186" class="bar"/>
<line x1="140" y1="172" x2="500" y2="128" class="rail"/>
<line x1="150" y1="140" x2="150" y2="171" class="ln"/><rect x="80" y="94" width="140" height="46" rx="6" class="bx"/><text x="150" y="114" text-anchor="middle" class="lb">Demands</text><text x="150" y="130" text-anchor="middle" class="sm">hours · deadlines · the load</text>
<line x1="490" y1="100" x2="490" y2="129" class="ln"/><rect x="420" y="54" width="140" height="46" rx="6" class="bx"/><text x="490" y="74" text-anchor="middle" class="lb">Resources</text><text x="490" y="90" text-anchor="middle" class="sm">time · people · authority</text>
<text x="150" y="198" text-anchor="middle" class="sm">demands exceed → burnout</text>
<text x="470" y="166" text-anchor="middle" class="sm">resources on their own → engagement</text>
<text x="600" y="40" text-anchor="middle" class="lb">add one</text>
<path d="M600 48 C602 70, 592 80, 566 84" class="ln ac-st" fill="none" marker-end="url(#dr)"/>
<text x="320" y="228" text-anchor="middle" class="sm">which single resource would move the ratio most? — that answer becomes an ask</text>
</g></svg>
